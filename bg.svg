<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e">
        <animate attributeName="stop-color" 
                 values="#ff9a9e;#fecfef;#fdfcfb;#a1c4fd;#c2e9fb;#ff9a9e" 
                 dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#fecfef">
        <animate attributeName="stop-color" 
                 values="#fecfef;#fdfcfb;#a1c4fd;#c2e9fb;#ffecd2;#fecfef" 
                 dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#fdfcfb">
        <animate attributeName="stop-color" 
                 values="#fdfcfb;#a1c4fd;#c2e9fb;#ffecd2;#fcb69f;#fdfcfb" 
                 dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
</svg>
