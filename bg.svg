<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b">
        <animate attributeName="stop-color" 
                 values="#ff6b6b;#feca57;#48dbfb;#1dd1a1;#a29bfe;#fd79a8;#ff6b6b" 
                 dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#feca57">
        <animate attributeName="stop-color" 
                 values="#feca57;#48dbfb;#1dd1a1;#a29bfe;#fd79a8;#ff6b6b;#feca57" 
                 dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#48dbfb">
        <animate attributeName="stop-color" 
                 values="#48dbfb;#1dd1a1;#a29bfe;#fd79a8;#ff6b6b;#feca57;#48dbfb" 
                 dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
</svg>
